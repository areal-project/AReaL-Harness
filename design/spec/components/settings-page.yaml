id: settings-page
name: 设置页
status: draft
purpose: 一页设置：按分区列出可调的项，每项一行，左边说清是什么，右边直接改。
why: 所有设置页共用同一种分区、卡片和行，用户换页不用重新学；控件只有几种，同类选择永远长一个样。

layout:
    place: 打开设置后占满主区（顶栏以下的纸面右段，底色 color-background）；会话标题栏这时只剩一条空的顶栏
    scroll: 整个主区一起竖向滚动；右侧始终给滚动条留位，内容不因出现滚动条而左右移动
    padding: 上下 spacing-field 的四倍，左右 spacing-field 的两倍
    column: 内容一列，最宽 reading-width，在留位后的宽度里水平居中
    gap: 页标题、各分区之间 spacing-field 的两倍半；两个例外：手机连接页的分区之间是 spacing-section；工作树页标题与下方“常规 / 环境”分段之间只隔 spacing-inline（分段算作标题的一部分），其后各分区之间是 spacing-section

anatomy:
    - part: header
      role: 页标题
    - part: section
      role: 分区：分区标题加一张卡片
    - part: card
      role: 卡片，竖排若干行
    - part: row
      role: 一项设置
    - part: disclosure
      optional: true
      role: 平时收起的高级分区，只有一行标题和“展开”

parts:
    header:
        padding: 上下 spacing-inline 的一倍半
        title: text-fixed-page-title，font-weight-medium，行高 line-height-title，字距 tracking-heading-tight，foreground
    section:
        gap: 标题与卡片之间 spacing-inline
        heading: 最小高 spacing-control-sm，文字贴底；text-ui-base，font-weight-medium，行高 line-height-ui，foreground
    card:
        surface: color-settings-card
        border: border-width-default 的 color-border-subtle
        radius: radius-panel
    row:
        padding: 上下 spacing-inline 的一倍半，左右 spacing-field
        min-height: spacing-control-sm 加 spacing-section
        layout: 左为文字列、右为控件列，两列间隔 spacing-section，垂直居中；控件列按内容撑开，最宽 reading-width 的八分之三，控件靠右，多个控件间隔 spacing-inline
        label: text-ui-caption，font-weight-medium，行高 line-height-ui-sm，foreground
        description: 名称下方 spacing-inline 的四分之一；text-ui-sm，font-weight-toolbar，行高 line-height-ui-sm，color-settings-secondary
        divider: 同一卡片里相邻两行之间一道线，高 border-width-default 的一半，color-border-subtle，左右各缩进 spacing-field
        detail: 需要整行宽的控件（例如文字输入框）放在文字与控件列下方，上方留 spacing-inline 的一倍半，占满行内宽度
    description:
        place: 页标题下方，属于 header，与标题间隔 spacing-inline 的一半；不放进第一个分区之前的空隙；text-ui-caption，行高 line-height-ui，color-settings-secondary
        when: 只有需要一句话说明整页作用的页才有（浏览器、钩子、工作树、手机连接，原文见 pages 各页的 description）；其余页不写
    section-heading:
        description: 分区标题下方紧跟一句说明（同 row 的 description 字号与颜色，行高 line-height-ui-sm），宽同标题文字列
        actions: 分区标题右侧可放按钮（button 的 compact 尺寸），与标题顶边对齐，按钮之间 spacing-inline
    chip:
        note: 只读的状态值（如“已授权”“就绪”），放在控件列
        size: 高 spacing-control，左右内边距 spacing-inline 的一倍又四分之一，圆角 radius-button，底色 color-surface；text-ui-base，行高 line-height-ui，color-settings-secondary
    status:
        place: 分区标题下或卡片第一行，说明当前状态的一句话；带读屏“状态”角色，内容变化时播报
        text: text-ui-sm，行高 line-height-ui-sm，color-settings-secondary；出错时换 color-destructive
    list-row:
        note: 卡片里一行代表一个对象（钩子、工作树、设备、上传记录），左为名称与一行摘要，右为对该对象的操作按钮；结构与间距同 row
        name: text-ui-caption，font-weight-medium，foreground
        summary: 名称下方，text-ui-sm，color-settings-secondary，单行省略
        actions: 图标按钮 spacing-control 见方，圆角 radius-button，图标 icon-size-control，颜色 foreground-subtle，悬停底色 color-hover；文字按钮用 button 的 secondary
    disclosure:
        summary: 不在卡片里，左右没有内边距，与分区标题左对齐；一行，上下 spacing-inline；左为分区标题（text-ui-base，font-weight-medium，行高 line-height-toolbar，foreground），右为“展开”
        action: 内边距上下 spacing-inline 的四分之一、左右 spacing-inline，圆角 radius-button，底色 color-button-surface，text-ui-sm，foreground；悬停整行时底色 color-button-hover
        open: 点整行展开，“展开”换成“收起”；展开后的内容不在本规格内

controls:
    switch:
        size: 宽 spacing-control-lg，高 line-height-ui，圆角 radius-full，内边距 spacing-inline 的四分之一
        track: 开时 color-brand，关时 foreground 的一成不透明度
        thumb: icon-size-control 见方的圆，color-control-thumb；关时在左，开时在右
        disabled: 整体 opacity-disabled
    select:
        trigger: 高 spacing-control-sm，左内边距 spacing-inline，右内边距 spacing-inline 的四分之三，圆角 radius-button；border-width-default 的 color-border，底色 color-button-surface；text-ui-caption，行高 line-height-relaxed，foreground；当前值后隔 spacing-inline 的四分之三放 select-chevron（foreground-subtle）
        hover: 底色 color-button-hover；打开期间保持
        popup: 外观与条目同 menu 组件的浮层与单选项（当前值打勾），对齐触发按钮右缘，在其下方间隔 spacing-inline 的四分之一；最窄为触发按钮宽与 reading-width 的六分之一两者取大
        two-options: 只有两个选项时不用下拉，改用 segmented
    segmented:
        list: 选项横排，间隔 spacing-inline 的四分之一，无底色
        option: 高 spacing-control-sm，内边距上下 spacing-inline 的四分之一、左右 spacing-inline，圆角 radius-full，border-width-default 的透明描边；text-ui-caption，font-weight-toolbar，行高 line-height-ui-sm，color-settings-secondary，底色透明
        selected: 底色 color-surface-tertiary，文字 foreground
        hover: 未选中项文字 foreground，底色 color-surface-elevated
    number:
        input: 高 spacing-control，宽 spacing-control-lg 的两倍，圆角 radius-compact；border-width-default 的 color-input-border，底色 color-input；text-ui-caption，font-weight-toolbar，行高 line-height-ui-sm，foreground，文字居中；左右内边距 spacing-inline
        unit: 输入框右侧隔 spacing-inline 的四分之三写单位，text-ui-sm，foreground-subtle
        focus: 描边 color-input-border-focused，底色 color-input-focused，不另画焦点环
    text:
        input: 放在行的 detail 位置，占满宽；高 spacing-control，圆角 radius-control，左右内边距 spacing-inline；border-width-default 的 color-input-border，底色 color-input；text-ui-base，行高 line-height-relaxed，foreground；占位文字 foreground-subtlest
        action: 控件列里一个“保存”按钮（button 的 secondary）；输入内容与已保存值相同时不可用
    value-action:
        value: 当前值，text-ui-sm，行高 line-height-ui-sm，foreground，单行省略，最宽 reading-width 的十六分之五
        action: 值右侧隔 spacing-inline 一个按钮（button 的 outline）
    button:
        size: 默认高 spacing-control，左右内边距 spacing-inline，圆角 radius-button，border-width-default 描边；text-ui-caption，行高 line-height-ui
        compact: 分区标题右侧和 list-row 里的按钮高 spacing-control-sm，行高 line-height-relaxed，其余同默认
        secondary: 底色 color-button-surface，描边透明，文字 foreground；悬停底色 color-button-hover；透明描边照样占位，底色只铺在描边以内，所以看得见的底色块比按钮高度少两道 border-width-default（看上去比 spacing-control 矮，实际按钮高仍是 spacing-control）
        primary: 底色 foreground，描边透明，文字 color-foreground-inverse；只给推进当前状态的主操作（如“添加设备”“开启内网连接”）
        outline: 底色透明，描边 color-border，文字 foreground；悬停描边 color-border-hover、底色 color-input 的一半不透明度
        disabled: 整体 opacity-disabled
    preview:
        text: 卡片里一段示例文字，四周 spacing-field；字号 text-conversation，行高 conversation-line，foreground

icons:
    source: 见 icons/ 目录，按名称引用，颜色取 currentColor
    used:
        [
            select-chevron,
            menu-check,
            usage-time,
            usage-streak,
            usage-tokens,
            usage-today,
            usage-skills,
            trash,
        ]

content: 常规、外观两页的分区、行与控件当前值见示例数据 settings.pages；kind 指 controls 里的控件；其余十页的内容见下面 pages，数据取示例数据 settingsBackend（日期以其中 today 为准）。示例数据 states 里的 settings 是页的内部名，与显示名的对应：用量＝使用情况，Cloud＝云端，Worktrees＝工作树，模型服务＝模型设置，其余同名

accessible-names:
    page: 区域，名称取页标题；页标题是一级标题
    section-title: 二级标题
    switch: 开关，名称即该行名称
    select: 组合框，名称即该行名称
    segmented: 选项卡列表，名称即该行名称；每个选项是选项卡，当前项标为已选
    number: 数字输入框，名称即该行名称
    text: 文本输入框，名称即该行名称
    disclosure: 摘要按钮，标为展开或收起

rules:
    - 十二页同宽：内容列都用 reading-width，任何一页不单独收窄或放宽（模型设置的两栏也在这个宽度以内）
    - 控件列最多占行宽的一半；一行里并排的按钮不折行，放不下时把按钮移到行的 detail 位置
    - 页面只有一层底色 color-background；卡片用 color-settings-card，卡片内不再铺第二种底色
    - 列表为空时不留只剩边框的空卡片：整张卡片换成一行说明文字（同 status）
    - 名称统一：工作树、侧边聊天、定时任务；不出现英文占位或内部名词

pages:
    使用情况:
        status: 标题下一行，左为“本机记录 · 所有工作区”（text-ui-sm，color-settings-secondary），右为“同步历史”（button 的 secondary，sm 尺寸，高 spacing-control-sm）；这一行的高度就是按钮高度
        metrics: 六张数字卡，三列等宽、两行，间隔 spacing-inline 的一倍半；每张卡 color-settings-card、radius-overlay、border-width-default 的 color-border（使用情况页的卡比通用设置卡的 color-border-subtle 深一级），内边距上下 spacing-field、左右 spacing-inline 的二倍半，卡内各行间隔 spacing-inline；第一行是图标（icon-size-control 减一级，即图标文件的尺寸）加名称，间隔 spacing-inline 的四分之三（text-ui-sm，color-settings-secondary）；中间是大数字（text-fixed-section-title 的 1.15 倍，font-weight-strong，行高为字号的 1.4 倍，foreground）；最后一行是补充（text-ui-xs，color-settings-secondary）
        metric-names: 累计使用（usage-time，补充“N 个活跃日”）、连续使用（usage-streak，“最长连续 N 天”）、累计 Token（usage-tokens，“N 轮已报告用量”）、今日 Token（usage-today，补充为今天日期）、昨日 Token（usage-today，昨天日期）、Skills 调用（usage-skills，“N 个技能”）
        derivation: 示例后台由 usage.days 推出各数：每天的使用时长（分钟）＝当天 Token ÷ 1000；累计使用为各天之和，写成“X 小时 Y 分”；活跃日与连续天数都等于 days 的天数；已报告轮数＝天数 × 6；Skills 调用为 usage.skills 各项次数之和，技能数为项数；今日、昨日取 days 最后两天；数字按千分位分组
        activity: 一张卡（同 metrics 的卡面，内边距 spacing-section）：标题“使用活跃度”（text-ui-base，二级标题）与说明“颜色越深，当天使用时间越长”（text-ui-caption，color-settings-secondary，与标题隔 spacing-inline 的四分之三），标题块与右侧控件间隔 spacing-inline 的二倍半，标题块下方隔 spacing-inline 的二倍半是日历，右上为年份下拉（组合框“统计年份”，当前“2026年”）；下方按周排列的整年日历（日历外围一圈 spacing-inline 的四分之一内边距；行名列与周列之间隔 spacing-inline），左侧行名周一、周三、周五、周日（各自与那一行方格的顶边对齐，单行不折行，列宽随文字），上方月份 1月…12月（text-fixed-metadata，color-settings-secondary）；每天一个小方格（radius-micro，高 spacing-inline 的一倍半，宽为按周均分的列宽：五十三周连同行名一起放进卡片内宽，不出现横向滚动；月份文字不占列宽，可以伸到右边的列上）：周列之间间隔 spacing-inline 的四分之一，列内顶部月份行高 spacing-inline 的二倍半加 border-width-default，之后七行每行 spacing-inline 的一倍半、行间 border-width-default；按当天使用时长分五级颜色：0 分钟取 color-hover，不到 30 分钟 color-activity-1，30 到 60 分钟 color-activity-2，60 到 120 分钟 color-activity-3，120 分钟及以上 color-activity-4（深色由变量自己换值，不另写规则）；今天以后的日子与当年之外的空位留空，不画方格也不可点；右下“少 … 多”图例（text-fixed-metadata，color-settings-secondary，色块与文字间隔 spacing-inline 的一半；上方隔日历 spacing-inline 的一倍半，下方隔当天详情 spacing-inline 的二倍半）；日历下方一行当天详情：日期、使用时间、Token、Skills 调用四栏，名称 text-ui-xs、数值 text-ui-caption 的 foreground
        ranking: 第二张卡：标题“Skills 排行”与说明“累计成功调用 · 按次数排序”，右上为搜索框（文本框“搜索 Skills 排行”，占位“搜索技能…”）；下方有序列表，每项为名次（text-ui-sm，color-settings-secondary）、技能名（text-ui-caption，font-weight-medium）、靠右的次数“N 次”（text-ui-base）；名次与技能名下方一条细进度条，填充色 color-activity；页标题下状态行左侧的圆点也取 color-activity
        disclosure: 最后一个收起的分区“统计口径与数据范围”
    SnapShots:
        unsupported: 当前环境不支持时，标题下先一行 status“此环境尚不支持 SnapShots。”；下面仍列出分区“SnapShots”和一行开关，名称“SnapShots”，说明两行：“捕获窗口并添加到当前草稿。”“正在检查截图…”；开关不可用
    浏览器:
        description: 管理链接打开方式和地址栏显示。
        general: 分区“常规”三行：“网页 URL 和链接打开位置”（无说明）、“本地 URL 打开位置”（说明“用于本地开发站点”）两行用 segmented（应用内 / 默认浏览器）；“显示完整网址”（说明“在地址栏中显示路径、查询参数和片段”）一行开关
        data: 分区“浏览器登录与数据”，说明“所有项目共用一个浏览器 Profile，登录跨重启保留。清理或导入会关闭当前页面。”；三行，各在控件列带一个与行名同名的 outline 按钮：从 Chrome 导入（说明“导入 Chrome 的 Cookie 和本地站点存储。仅点击后读取源数据，macOS 可能要求钥匙串授权。”）、清除缓存（“清理页面与服务缓存，保留 Cookie 和登录存储。”）、清除全部浏览数据（“删除所有项目共享的 Cookie、登录和站点存储。”）
    云端:
        form: 一个表单分区“Cloud 连接”，说明“保存服务地址与认证信息，新建 Cloud 会话时才连接并启动沙箱。”；卡里两行，输入框都在控件列（宽 reading-width 的八分之三）：后端地址（说明“固定服务地址，无需填写工作区或会话 ID。”，已填，文本框“Cloud 后端地址”）、Token（说明“在本机安全存储”，占位“已保存，留空保留”，文本框“Cloud token”）；两个输入框外观相同（Token 是密码框，字号、高度、边框与地址框一致：text-ui-caption，高 spacing-control）；卡片下方靠右一个“保存”（button 的 primary）
    电脑控制:
        mode: 第一张卡三行：控制方式（说明“切换会先停止当前控制。外部 CUA 仅用于启用后新建的普通聊天。”；segmented：内置 / 外部 CUA（LCU））、启用电脑控制（“允许 Agent 经审批操作本机应用。系统权限由你单独授权。”，开关）、在输入框显示电脑操作按钮（“按钮打开电脑控制设置。隐藏按钮不会关闭能力。”，开关）
        permissions: 分区“系统授权”，说明“为 AReaL Computer Helper 授权。权限状态由实际执行操作的 Helper 检查。”；每项权限一行：辅助功能 (Accessibility)（“读取应用界面，并操作可访问的控件。”）、屏幕录制 (Screen Recording)（“截取目标窗口，供 Agent 观察。”）；控件列依次为“授权”“打开系统设置”两个 secondary 按钮和一个 chip（已授权 / 未授权），并排不折行
        process: 分区“控制进程”，说明“权限修改后可以重新检查或重启 Helper。停止操作会撤销当前控制和观察引用。”；一行，名称为状态“电脑控制已关闭”，控件列横排三个 outline 按钮：刷新权限状态、重启控制 Helper、停止电脑操作（三个按钮放得下，留在控件列，不折行）
    工作树:
        description: 管理工作树的创建、清理和项目环境。
        tabs: 页标题行最右为“刷新工作树”图标按钮（refresh 的同类图标，spacing-control 见方，贴页标题区上内边距与右缘；标题文字右侧让出 spacing-control-lg）；header 下方第一项是 segmented 两项：常规、环境
        general: 分区“创建与清理”四行：工作树根目录（“留空使用默认位置，仅影响之后创建的工作树。”，文字输入在控件列，宽 reading-width 的三分之一）、创建前获取远程分支（“创建工作树前从远程更新引用。”，开关）、自动清理（“自动清理符合条件的旧工作树。活动或有未提交改动的工作区会保留。”，开关）、保留工作树数量（“固定、活动或受保护的目录可能超过此数量。”，number）；随后收起的“高级创建选项”
        list: 分区“已有工作树”：按项目分组，组头一行为 folder 图标加项目名（text-ui-sm，color-settings-secondary）；组内每个工作树一行（list-row），左为展开箭头与分支名，右为删除图标按钮（trash，读屏“删除 <分支名>”）；没有工作树时整块换成一行说明“尚未创建工作树”
    钩子:
        description: 按顺序运行工具事件命令，修改后重启后台生效。
        hooks: 分区“工具钩子”，标题右侧“刷新钩子”（outline）与“添加钩子”（primary），都是 compact；每个钩子一行（list-row）：名称（如“提交前检查”）、摘要为事件 · 工具 · 超时（如“PreToolUse · Bash · 10,000 ms”）；右侧“上移”“下移”两个 secondary 文字按钮与“编辑”outline 按钮，都是 compact；首个不能上移、末个不能下移时按钮不可用
        project: 只有存在项目级钩子时才出现“项目钩子”分区；没有时不留空卡片
        apply: 分区“配置生效”不用卡片：分区标题与说明“保存不会中断执行；应用时需重启共享后台。”，标题右侧“重启后台并应用”（outline，compact）；最后收起的“配置详情”
    模型设置:
        layout: 内容列内左右两栏：左栏“供应商目录”宽为 reading-width 的七分之二，右栏为当前供应商的编辑区；两栏间隔 spacing-panel，右栏左缘一道 border-width-default 的 color-border 竖线，线内再留 spacing-panel
        catalog: 左栏标题“供应商”（text-ui-base，font-weight-strong）加刷新图标按钮；下面搜索框“搜索供应商”（高 spacing-control-sm 加 spacing-inline）；列表按“已启用 / 未启用”分组（组名 text-ui-sm，color-settings-secondary，组名行上内边距 spacing-inline、下内边距 spacing-inline 的一半，所以组名文字离分隔线比 spacing-field 远一个 spacing-inline），每项是一个按钮，上下内边距 spacing-inline，圆角 radius-control，圆点表示状态，当前项底色 color-selected；“已启用”“未启用”两组之间一道 border-width-default 的 color-border 横线，线上下各留 spacing-field（从上一组最后一项的按钮下缘量到线，再从线量到下一组组名的行框顶，不按文字笔画量）；底部“添加供应商”（button 的 outline，占满栏宽）
        editor: 右栏顶部 status“已保存并应用。”；之后为供应商名（text-ui-lg，font-weight-strong）与状态“可用”（text-ui-caption，color-settings-secondary）在左、“启用”加开关在右，与下方表单隔 spacing-field
        fields: 表单是竖排的字段，不用卡片行：每个字段先一行字段名，下方 spacing-inline 的一半处是控件；字段之间 spacing-section；字段名 text-ui-base、color-settings-secondary（“供应商名称”一项用 text-ui-caption，与输入框隔 spacing-inline）；输入框高 spacing-control-sm 加 spacing-inline，text-ui-base
        order: API 格式（segmented：Chat Completions / Responses）、供应商名称（输入框，右侧移除供应商图标按钮 trash）、Base URL、认证方式（segmented：API Key / 无需认证）、连接卡（border-width-default 的 color-border，radius-panel，内边距 spacing-field：“连接已配置”加 outline 的“测试连接”）、模型列表
        models: “模型 · 数量”（text-ui-base，foreground-subtle）右侧“获取模型”“添加模型”两个 secondary 按钮并排，间隔 spacing-inline；搜索框“搜索模型名称或 ID”；每个模型一行（最小高 spacing-control-form，内边距 spacing-field，行间一道 color-border 线）：名称（font-weight-strong）、标签（如“备用默认”，text-ui-sm，强调色）、小号启用开关、更多操作按钮；最后收起的“高级参数”
        footer: 编辑区底部靠右“取消修改”（outline）“保存”（primary），无改动时都不可用；页底一行“新会话默认模型”（segmented）加“前往会话配置”（button 的 link，无左右内边距，字号跟随这一行的 text-ui-sm），与上方隔 spacing-section
        buttons: 本页所有文字按钮都是默认尺寸（高 spacing-control），不用 compact；次要按钮混用 outline（添加供应商、测试连接、取消修改）与 secondary（获取模型、添加模型），见 quality.md“还没覆盖”；统一前以此处为准
    手机连接:
        description: 用 iPhone 或其他浏览器继续电脑上的工作。
        status: 第一张卡：左为状态圆点块（spacing-control-lg 见方，圆角 radius-control，底色 color-surface，中间 spacing-inline 见方的圆点为 color-success），名称“手机可以连接”（text-ui-base，font-weight-medium）与摘要“通过中继 relay.example.com · 已连接”（text-ui-sm，color-settings-secondary），右为主按钮“添加设备”（button 的 primary）；卡内下方一行“已登记中继 relay.example.com，注册码已使用，无需再次填写。”（text-ui-base，color-settings-secondary）
        relay: 分区“Relay 服务”，说明“默认在本机启动，手机可通过互通的内网或 VPN 直接扫码连接。”；卡内“本机 Relay”名称与说明“自动选择内网地址。跨网络连接取决于网络可达性。内网 HTTP 链接请在 AReaL Remote App 中扫描。”，下方主按钮“开启内网连接”（button 的 primary）；再两个收起的子项：部署到 Linux 服务器、使用已有外部服务
        spacing: 页标题块到状态卡仍是通用的 spacing-field 的两倍半；从状态卡开始，状态卡、Relay 服务、设备、收起的网络设置之间都是 spacing-section（见 gap 的例外），分区标题块与它的卡片之间是 spacing-inline（“设备”也一样：标题行下方 spacing-inline 处就是设备卡）；本页文字按钮（含主按钮“添加设备”“开启内网连接”）都是默认尺寸，高 spacing-control，只有“私人网络”这类分段选项是 sm；量高度时量按钮盒子，不按底色块量
        devices: 分区“设备”，标题右侧写“1 台可用”（text-ui-sm，color-settings-secondary）；每台设备一行（list-row）：设备图标、名称“我的 iPhone”、摘要“iPhone · 0 个项目 · 在线 · 推送未开”；右侧权限“仅查看”（text-ui-sm，color-settings-secondary）与更多操作按钮；没有设备时一行说明
        disclosure: 最后收起的“高级网络设置”
    数据飞轮:
        feedback: 分区“回答评价”，说明“自愿提交点赞或点踩，帮助改进回答质量。”；一行开关“显示点赞和点踩”（“开启数据飞轮并连接接收端后，在回复下方显示。点击不会自动提交。”）
        upload: 分区“轨迹上传”，说明“后台自动上传，状态定期更新。”，标题右侧“刷新上传状态”（outline，compact），下方 status“上次读取：时间”；卡内依次为：数据飞轮开关（“已启用后台轨迹上传；重新开启会补传仍保留的待传和失败记录。”，开关左侧文字“已开启”，text-ui-sm，color-success）、配置状态（“上传地址和认证在配置文件中设置，这里只控制开关。”，chip“就绪”）、上传进程（“后台上传进程正在运行。”，值“运行中”）、上传地址（地址作为说明文字，可断行）
        queue: 分区“队列与失败”，说明“仅反映上传队列，不代表远端已完成数据分析或入库。”，标题右侧“重试上传”（outline，compact）；卡内五行，数值靠右（text-ui-caption 的 foreground）：待上传 / 上传中 / 失败、已上传（说明“最近成功：时间”）、队列占用、已淘汰 / 内存丢弃 / 过大丢弃（“已淘汰或丢弃的数据无法重试恢复。”）、最近失败原因（原因作为说明文字，没有时“暂无失败记录”）
        latency: 分区“模型调用耗时”，说明“最近 N 条记录；包含请求准备、网络、排队与重试耗时。”；没有数据时一行 status，说明暂无耗时汇总、耗时未知，不画空图表
        records: 分区“最近上传记录”，说明“最近最多 100 条，每页 15 条；事件发生、记录创建与上传成功时间分别显示。”：上下各一条分页导航（“上传记录分页”，左写“第 a–b 条，共 n 条”，右为“上一页”、“第 x / y 页”、“下一页”，按钮 outline compact）；每条记录一行：编号、模型、耗时、创建时间 · 大小 · 尝试次数，右侧状态（已上传 / 待上传 / 上传失败），失败时名称下多一行原因
        disclosure: 最后收起的“上传配置与限制”

keyboard:
    - 开关按空格切换
    - 下拉打开后上下方向键移动，回车选中并收起，Esc 收起不改
    - 分段选择用左右方向键移动，回车或空格选中

behavior:
    - 从设置导航点任一页，主区换成该页，标题即导航项名称，导航项标为当前页
    - 改动立即生效，不需要另点保存（文字输入行除外，按“保存”或回车生效）
    - 选择后控件立即显示新值
