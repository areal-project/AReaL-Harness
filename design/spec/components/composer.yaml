id: composer
name: 输入框
status: draft
purpose: 用户写下任务并提交给 Agent；运行中继续输入会进入队列，停止也在这里。
terms:
  普通对话: 用户直接发起的主对话；任务、目标和侧边对话不算
why: 输入区与对话正文同一字号与节奏，读起来像对话的下一行，视线在读和写之间不换尺度。

anatomy:
  - part: context-bar
    optional: true
    role: 输入框上方的一条，显示当前项目与工作区，最右是工作区设置入口
  - part: attachments
    optional: true
    role: 实际上传的附件缩略卡；文件、技能等引用不在这里，而是正文内的行内标识
  - part: editor
    role: 多行文字输入，随内容增高，到上限后在内部滚动
  - part: toolbar
    role: 一行控件，左侧添加与权限，右侧上下文占用（仅对话中）、模型、强度与主按钮
    children: [add-menu, permission-menu, context-meter, model-menu, effort-menu, primary-action]
  - part: decision-slot
    optional: true
    role: 待处理的审批或提问卡片出现在输入框正上方，只在这里出现

variants:
  placement:
    home: 首页草稿，位于视觉重心，圆角取大号
    thread: 对话底部
    inline: 在一条用户消息内改写；平面无阴影，底色 color-composer-catalog，聚焦时只有一圈 border-hover 描边
  layout:
    default: 编辑区在上，工具栏在下
    compact: 窄容器与侧边对话，编辑区与工具栏同一行；容器变窄时工具栏换到编辑区下方
    decision: 有待处理的审批或提问时压成一行，只保留添加、模型与主按钮，草稿不丢

states:
  - empty: 占位文字说明输入目标；主按钮不可用并说明原因
  - draft: 有文字或附件；主按钮为“发送”
  - focused: 阴影外再加一圈 border-width-default 粗的 color-border-hover，最外一圈三倍粗的 color-focus-ring-soft；有草稿时编辑区自动获得焦点
  - dragover: 拖入文件时整体出现放置提示
  - sending: 提交中；保留草稿直到确认受理
  - running: 草稿为空时主按钮为“停止”（普通对话为“暂停执行”）；有草稿时主按钮为“发送”，提交进入队列
  - blocked: 草稿为空时只禁用主按钮；其他不能发送的原因（没有模型、后台不可用）以可见文字关联到主按钮，不只靠悬停提示
  - error: 错误以一行可关闭的反馈出现在输入框正上方，草稿保留；不用顶部弹窗

tokens:
  surface: color-composer
  material: raised
  elevation: shadow-composer
  radius:
    home: radius-composer-large
    thread: radius-composer
    inline: radius-composer
    compact: radius-composer-large；容器变窄时 radius-composer
  inset: composer-inset（编辑区左右与顶部、工具栏左右）
  toolbar-gap: spacing-inline
  toolbar-height: spacing-control
  icon: icon-size-control
  disabled: opacity-disabled
  text: text-conversation
  line: conversation-line
  focus: color-focus-ring-soft
  editor-min: 最少两行高（两倍 conversation-line），再往上 composer-inset
  toolbar-label: text-ui-caption；模型名 foreground，权限名 foreground-subtle
  primary-action-shape: spacing-control 见方的圆（radius-pill）
  running: 运行中权限、模型、强度三个入口降低不透明度，但仍可读
  primary-action: color-composer-action

behavior:
  - 草稿在切换布局、收起审批、模型保存期间保持同一实例，不丢失、不重建
  - 编辑区高度到上限后在内部滚动，外框不再长高
  - 输入 @ 引用文件与资源，$ 选技能，/ 打开命令；关键词就在输入框里输入，菜单不另设搜索框
  - 保存模型或强度配置时不播放发送中的提示，也不打断输入焦点

accessibility:
  - 编辑区有可读名称；图标按钮都有可读名称
  - 键盘顺序与视觉顺序一致：编辑区、工具栏、主按钮
  - 不可发送的原因对读屏可见，并关联主按钮
  - 中文输入法组合期间按回车不提交

accessible-names:
  editor: 与占位文字相同；可以是多行文本框或可编辑区域
  primary-action:
    draft: 发送
    running-empty: 停止；普通对话为“暂停执行”
    running-with-draft: 发送
  add-menu: 添加功能与 Skills
  permission-menu: 更改权限
  context-meter: 上下文占用
  permission-label: 当前权限模式名，见示例数据
  effort-label: 当前思考强度名，见示例数据
  queue-region: 待发送消息
  queue-item:
    send-now: 立即发送 {内容}
    delete: 删除排队消息 {内容}
    reorder: 调整顺序 {内容}
    more: 更多操作 {内容}
  model-menu: 选择模型
  effort-menu: 选择思考强度
  placeholder: 描述要做的事，@ 引用文件，/ 查看命令

references:
  - state: home.empty
  - state: home.draft
  - state: thread.running
  - state: thread.queued
