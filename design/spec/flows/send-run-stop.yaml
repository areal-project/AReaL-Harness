id: send-run-stop
name: 发送、运行、停止
status: draft
screens: [home, thread]
components: [composer]

initial: home.empty

states:
  home.empty:
    see: 首页标题与空输入框；主按钮“发送”不可用
  home.draft:
    see: 输入框有文字；主按钮“发送”可用
  thread.sending:
    see: 已进入对话界面；用户消息出现在信息流；输入框清空
  thread.running:
    see: 回合末尾一行状态文字在变化；草稿为空时主按钮为“停止”（普通对话为“暂停执行”）
  thread.queued:
    see: 输入框上方出现排队的消息；当前回合继续运行
  thread.stopping:
    see: 主按钮暂时不可用；状态行显示正在停止
  thread.done:
    see: 过程收起为一行标题；最终回答完整可见；主按钮回到“发送”
  thread.stopped:
    see: 过程标题标明已停止；已产生的内容保留；主按钮回到“发送”
  thread.error:
    see: 顶部反馈弹窗说明原因；草稿保留在输入框；主按钮回到“发送”

transitions:
  - from: home.empty
    on: type-text
    to: home.draft
  - from: home.draft
    on: clear-text
    to: home.empty
  - from: home.draft
    on: [click 发送, press Enter]
    to: thread.sending
    motion: motion-normal + ease-enter；输入框从首页位置移到底部
  - from: thread.sending
    on: accepted
    to: thread.running
  - from: thread.sending
    on: rejected
    to: thread.error
  - from: thread.running
    on: [type-text then click 发送]
    to: thread.queued
  - from: thread.queued
    on: turn-finished
    to: thread.running
    note: 队首消息自动开始下一回合
  - from: [thread.running, thread.queued]
    on: click 停止
    to: thread.stopping
  - from: thread.stopping
    on: stopped
    to: thread.stopped
  - from: thread.running
    on: turn-finished
    to: thread.done

invariants:
  - 任何状态下草稿不因失败或切换而丢失
  - 主按钮只有一个，文字随状态变化，位置不变
  - 运行中输入框上方不加状态栏

conformance:
  - 在首页输入文字并按回车，信息流出现该用户消息，主按钮名称变为“停止”或“暂停执行”
  - 运行中点击“停止”（或“暂停执行”），主按钮名称回到“发送”，已产生的内容仍在
  - 运行中再发送一条，输入框上方出现排队消息，当前回合不中断
  - 提交被拒绝时，顶部出现反馈，输入框里仍是原文字
