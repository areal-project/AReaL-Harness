# 第三次交接演练：补完第二次的缺口后，新 Agent 只拿规格包从零复现。
date: 2026-11-07
module: 输入框试点 + 对话回合
given: [规格包, Token 源及生成的变量, 图标, 空项目]
result:
  first-pass:
    behavior: 6/6
    screenshots: 0/12
    difference: 首页差异最大（暗色约为门槛的七十倍），对话约为门槛的六到二十倍；一处偏差就整张不过
  after-iteration:
    behavior: 6/6
    screenshots: 12/12（首页逐像素一致，对话每张只差 9 至 14 个像素）
verdict: 行为一次通过；截图仍全挂。各处偏差都能追到具体的规格缺口，不是复现能力问题。最大的两项是 Agent 正文字距没有变量、首页高度描述自相矛盾
gaps-fixed:
  - Agent 正文与过程文字的字距进 Token 源（tracking-conversation），并写明哪些文字不用；第二次演练未查明的字距差即此项
  - 首页迎宾区高度写明已含底部留白，输入框顶部位置可直接算出；标题行高进 Token 源（line-height-title）
  - 工具栏入口的内边距、间隔、高度与字重（font-weight-toolbar）写进规格；上下文占用补图标文件
  - 图标统一按文件宽高渲染，添加与权限图标文件改为实际渲染尺寸
  - 主按钮不可用时的底色与图标颜色按实际写明；输入框工具栏下方留白写明
  - 焦点两圈都从外框边缘起算
  - 回合过程标题：分隔线属于标题块、线下仍有内边距、到下一块一个 conversation-gap（第二次演练写成两倍是错的）；文字与箭头间距
  - 操作行向左外伸 spacing-inline 的一半；回合导航相对信息流区域居中，补标记缩进与当前回合圆点
  - 排队卡片的内边距、行高、序号列、按钮几何改为由现有变量算出，规格逐项写明；实现随之对齐，标准截图只有排队状态两张变化 1 至 2 像素
  - 示例数据的字体环境说明改为实际情况
gaps-open:
  - “正在停止…”等过渡文字与时序、排队“立即发送”与“更多”的结果、悬停时回合导航加深多少仍未写
  - 首页提交被拒后对话界面无回合时应显示什么未写
  - 截图门槛下一处偏差就整张不过，首轮张数难以反映进展；同时记录每张差异比例
next: 第四次演练，只看首轮，目标截图 ≥ 9/12
