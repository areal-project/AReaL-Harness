# 第四次交接演练：补完第三次的缺口后，新 Agent 只拿规格包从零复现。
date: 2026-11-07
module: 输入框试点 + 对话回合
given: [规格包, Token 源及生成的变量, 图标, 空项目]
result:
  first-pass:
    behavior: 6/6
    screenshots: 0/12（按首轮门槛 --threshold 0.01 计为 10/12）
    difference: 首页约为门槛的二到五倍，对话约为门槛的五到十三倍；比第三次（首页最多七十倍）大幅收窄
  after-iteration:
    behavior: 6/6
    screenshots: 12/12（对话几张刚好压线，靠对截图拟合的一像素偏移）
verdict: 偏差已从大块错位缩到工具栏一带与一处间距；首轮最大的一项是复现者自己的样式优先级错误，规格缺口剩下工具栏分组与过程体间距
gaps-fixed:
  - 过程标题到展开的过程体是两倍 conversation-gap、收起时到回答一倍；回合节奏规则注明这一处例外（第三次把两种情况写成一种）
  - 工具栏分左右两组，组内间隔分别写明；工具栏高度由模型入口决定，不是 spacing-control
  - 哪些入口带菜单箭头、添加按钮颜色、占位文字颜色、首页标题居中写明
gaps-open:
  - 第三次遗留的过渡文字、排队按钮结果、回合导航悬停加深程度
next: 第五次演练，目标首轮截图 ≥ 9/12；连续两次未达标则评估截图门槛是否适合衡量首轮（D-005 重新评估条件）
