verdict: 首轮未全达标；失败来自复现者自身错误，但规格写得不够醒目，补写后再演练一次
gaps-fixed:
  - 对话行悬停按钮写明尺寸、圆角、图标与菜单打开期间的样子；补 pin、archive 图标
