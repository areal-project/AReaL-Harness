# 第九次交接演练：模块推广到侧栏与项目导航（窗口界面、搜索任务），连同此前三个模块一起从零复现。
date: 2026-11-07
module: 侧栏与项目导航（连同输入框、对话回合与待决卡片）
given: [规格包, Token 源及生成的变量, 图标, 空项目]
result:
  first-pass:
    behavior: 17/17（新增导航七条全过）
    screenshots: 11/26（首轮门槛）；新增窗口十张过一张
    difference: 窗口各张最高约为门槛的三倍多，主要是侧栏列表整体错位一行；对话界面几张略超门槛
verdict: 行为一次通过；截图偏差多数追到规格缺口，另有两处复现者自身错误（编辑区多出一行、搜索框宽度没算描边）
gaps-fixed:
  - 置顶的对话只出现在置顶分组，不再列在项目里
  - 状态位：项目与任务分组的对话总留这一位，只有置顶分组在无状态时不留
  - 项目分组里每个项目自成一组，下方留 spacing-inline
  - 回合节奏写明用户消息（气泡连同占位的操作行）算一块，到过程标题一个 conversation-gap
  - 收起侧栏后顶栏左段缩成 rail-width 宽并保留右缘竖线
  - 新聊天入口上方不留白
  - 搜索占位文字颜色写明
  - 会话标题行高进 Token（line-height-ui），实现显式引用；窗口标准截图随之更新
gaps-open:
  - 对话行悬停操作与项目整理菜单没有标准截图
next: 再演练一次，目标窗口十张首轮全过
