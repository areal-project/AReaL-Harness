# 交接演练记录：只给规格包与空项目，新 Agent 从零复现输入框试点。
date: 2026-11-07
module: 输入框试点（首页、对话、发送—运行—停止）
given: [规格包, Token 源及生成的变量, 空项目]
result:
  behavior: 6/6
  screenshots: 9/12
  first-pass: 15/18
  misses:
    - thread.idle 亮暗：行内代码的等宽字体在不同机器上解析不同
    - thread.stopped 暗色：图标为手绘近似，略超阈值
verdict: 行为可以只靠规格复现；外观主要靠量标准截图得到，规格本身还不够
gaps-fixed:
  - 迎宾标题文字写进首页规格，示例数据去掉与截图矛盾的字段
  - 首页纵向位置写明主区顶部留白
  - 定义“普通对话”，补齐排队消息各按钮的可读名称与权限、强度标签来源
  - 发送中状态统一为受理后才清空输入框
  - 运行中与暂停后的回合末尾文字写进对话规格
  - 不能发送的原因只在非空草稿时要求可见
  - 验收按完整名称匹配“发送”，输入框可以是多行文本框
  - 说明文档中的示例变量名改为真实存在的名称
gaps-open:
  - 用户消息、回合过程标题、最终回答、操作行、暂停分隔线没有组件规格，只能量截图
  - 输入框内部间距、图标尺寸、禁用透明度、焦点描边几何没有 Token
  - 输入框亮色阴影引用宿主变量，Token 源里没有定义
  - 回合过程标题用了抬起面的颜色，与“平面材质”的规则冲突
  - 等宽字体栈不可移植，截图基线需要固定字体
  - 图标集没有进规格包
  - 页面左缘的回合导航标记没有规格
  - 菜单内容、@ $ / 触发和“完成”状态没有示例数据
next: 阶段 2 文字层级与阶段 3 圆角阴影材质先补 Token；对话流组件补规格后再演练一次
