id: window
name: 窗口（侧栏加对话）
status: draft
purpose: 桌面窗口的完整骨架：左边找对话，右边读和写。
why: 侧栏与对话共用一张纸面，只在顶栏和最左一列露出窗口底色，视线落在内容上。

regions:
  - id: frame
    name: 窗口
    layout: 底色 color-shell，四角 radius-overlay；右缘与下缘各留 spacing-inline 的一半；顶栏、应用导航栏与纸面都排在这圈留白以内（应用导航栏下缘、会话标题栏右缘都以留白内侧为准，不贴窗口边）
  - id: top-bar
    name: 顶栏
    layout: 横贯窗口，高度为 height-toolbar 与 text-ui-base 加 spacing-control-lg 两者取大；左段属于侧栏（见 navigation-sidebar 的 window-controls），其余属于会话标题栏 C；顶栏没有自己的底色
  - id: page
    name: 纸面
    layout: 顶栏以下、应用导航栏以右，到窗口右下的留白为止；圆角 radius-panel，投影 shadow-page-surface；左段是侧栏的导航内容（color-navigation-background），右段是主区（color-background），两段之间没有分隔线
  - id: A
    name: 应用导航栏
    contains: [navigation-sidebar.application-rail]
  - id: B
    name: 侧栏
    contains: [navigation-sidebar]
  - id: C
    name: 会话标题栏
    layout: 在顶栏右段；左 spacing-field、右 spacing-inline，元素间隔 spacing-inline
    contains:
      - title: folder 图标（icon-size-control，foreground-subtle）加侧栏里当前对话的标题（text-ui-base，font-weight-medium，行高 line-height-ui，foreground，单行省略）；在顶栏内垂直居中
      - side-panel: 最右一个 spacing-control 见方的按钮，图标 side-panel，颜色 foreground-subtle，读屏名“展开侧边面板”
      - window-controls: 侧栏收起时，后退、前进、展开侧栏三个按钮作为一组移到标题最前；组内仍按 window-controls 的间隔（spacing-inline 的一半），组与标题之间才是 spacing-inline
  - id: main
    name: 主区
    layout: 纸面右段，内容与 thread 界面的 D、E 相同（示例数据里显示 thread-idle）；回合导航贴主区左缘
    contains: [thread]
  - id: search
    name: 搜索任务
    contains: [task-search]
  - id: overlays
    name: 浮层
    contains: [menu.task-menu, menu.organize-menu, dialog.rename]
  - id: settings
    name: 设置
    layout: 点应用导航栏底部的“设置”打开：B 换成 settings-navigation，主区换成 settings-page，会话标题栏只留空顶栏；应用导航栏里“设置”成为当前入口（底色 color-selected），首页图标换回空心；“返回应用”回到原样
    contains: [settings-navigation, settings-page]

fixtures: [send-run-stop]

states:
  - sidebar: 侧栏展开，当前对话为 thread-idle
  - collapsed: 同上，但“文档站”项目收起
  - search: 搜索打开，关键词为空，列出全部对话
  - search-query: 搜索关键词“README”
  - rail: 侧栏收起，只剩应用导航栏
  - task-menu: 同 sidebar，当前对话行的“任务操作”菜单用鼠标刚打开，没有高亮项；这一行保持悬停样子（悬停按钮可见、标题让位）
  - organize-menu: 同 sidebar，“侧栏整理”菜单打开，在“项目内任务排序”上按右方向键打开了子菜单，子菜单第一项“最近更新”高亮且打勾
  - rename: 同 sidebar，从当前对话的任务菜单点了“重命名”，弹窗打开，输入框预填当前标题并已聚焦
  - settings: 同 sidebar，打开了设置，当前页“常规”
  - settings-appearance: 设置打开，当前页“外观”
  - settings-search: 设置打开，当前页“常规”，搜索框里是“字号”（未聚焦），列表只剩个人组的“外观”，右端写“字号”
  - settings-select: 设置打开，当前页“外观”，“界面主题”下拉用鼠标刚打开，当前值“跟随系统”打勾并高亮

references:
  - state: sidebar
    themes: [light, dark]
  - state: collapsed
    themes: [light, dark]
  - state: search
    themes: [light, dark]
  - state: search-query
    themes: [light, dark]
  - state: rail
    themes: [light, dark]
  - state: task-menu
    themes: [light, dark]
  - state: organize-menu
    themes: [light, dark]
  - state: rename
    themes: [light, dark]
  - state: settings
    themes: [light, dark]
  - state: settings-appearance
    themes: [light, dark]
  - state: settings-search
    themes: [light, dark]
  - state: settings-select
    themes: [light, dark]
