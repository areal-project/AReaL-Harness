[project]
name = "areal-harness-development"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/areal-project/AReaL-Harness"
Issues = "https://github.com/areal-project/AReaL-Harness/issues"

[dependency-groups]
dev = ["ruff==0.16.8"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["tests/perf/suites", "tests/perf/cases"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
