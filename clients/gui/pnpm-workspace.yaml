packages:
  - app
  - ../mobile
  - renderer
  - packages/*
  - oxlint-plugin-areal

verifyDepsBeforeRun: error
# Keep installs and verification on the same layout in local shells and CI.
enableGlobalVirtualStore: false
peerDependencyRules:
  allowedVersions:
    "@vitejs/plugin-react@5.2.0>vite": "1.4.0"
    "@tailwindcss/vite@4.2.2>vite": "1.4.0"
    "vitest@5.0.5>vite": "1.4.0"
    "@vitest/mocker@5.0.5>vite": "1.4.0"
    "@tailwindcss/typography@0.5.19>tailwindcss": "4.2.2"
allowBuilds:
  "@google/genai": false
  electron: true
  electron-winstaller: false
  esbuild: true
  protobufjs: false

patchedDependencies:
  "@chainsafe/libp2p-noise@17.0.0": patches/@chainsafe__libp2p-noise@17.0.0.patch
  "@pierre/diffs@1.4.3": patches/@pierre__diffs@1.4.3.patch
  app-builder-lib@26.15.3: patches/app-builder-lib@26.15.3.patch
  fetch-blob@3.2.0: patches/fetch-blob@3.2.0.patch
  electron-updater@6.8.9: patches/electron-updater@6.8.9.patch
  "@electron/asar@3.4.1": patches/@electron__asar@3.4.1.patch
  dir-compare@4.2.0: patches/dir-compare@4.2.0.patch
overrides:
  "@libp2p/crypto": 5.1.23
  "@libp2p/peer-id": 6.0.15
  "@libp2p/utils": 7.4.0
  vite@*: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest@*: 5.0.5
  "@modelcontextprotocol/sdk@<1.32.0": 1.32.0
  zod@<4.6.6: 4.6.6
  fast-uri@<3.1.9: 3.1.9
  undici@>=6.0.0 <6.29.1: 6.29.1
  undici@>=7.0.0 <7.30.1: 7.30.1
  "@dicebear/core@<=9.4.2": 9.4.3
  basic-ftp@<=6.2.0: 6.2.1
  dompurify@<=3.4.16: 3.4.17
  ip-address@<=10.7.3: 10.7.4
  katex@>=0.11.0 <0.18.2: 0.18.2
  postcss-selector-parser@<7.1.6: 7.1.6
  "xcode@3.0.1>uuid": 11.1.1
  "app-builder-lib>@electron/get": 5.1.0
  "fetch-blob@3.2.0>node-domexception": "-"
  "electron-updater@6.8.9>lodash.isequal": "-"
  "@electron/asar@3.4.1>glob": 14.0.2
  "glob@>=9.0.0 <=14.0.1": 14.0.2
  minimatch@<11.0.1: 11.0.1
  "app-builder-lib@26.15.3>electron-builder-squirrel-windows": "-"

packageExtensions:
  "app-builder-lib@26.15.3":
    dependencies:
      got: 11.8.6
      proxy-from-env: 1.1.0
