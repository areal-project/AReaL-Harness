[package]
name = "areal-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
test-support = []
native-tests = ["test-support"]

[dependencies]
rusqlite = { version = "=0.41.0", features = ["bundled"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = "=0.10.4"
url.workspace = true
areal-runtime-fs = { path = "../../runtime/fs-helper" }
areal-plugins.workspace = true
areal-runtime-host-tools.workspace = true
areal-config.workspace = true
schemars = "1.2.2"
areal-mcp.workspace = true
areal-protocol.workspace = true
areal-runtime-client.workspace = true
areal-runtime-protocol.workspace = true
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
fs2.workspace = true
futures-util.workspace = true
jsonschema.workspace = true
libc.workspace = true
reqwest.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value", "float_roundtrip"] }
sha2.workspace = true
thiserror.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
ignore = "0.4.25"
gif = "=0.13.3"

[dev-dependencies]
tracing-subscriber.workspace = true
axum.workspace = true
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
