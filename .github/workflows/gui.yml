name: GUI checks

on:
  workflow_dispatch:
    inputs:
      comparison_base:
        description: Ancestor commit used for incremental source checks
        required: false
        type: string
      qualification:
        description: Optional repeated platform qualification; reports require review before promotion
        required: false
        type: choice
        options: [none, linux-feasibility, macos-baseline]
        default: none
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'
  NO_PROXY: 127.0.0.1,localhost

concurrency:
  group: gui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Determine applicable work
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      gui: ${{ steps.scope.outputs.gui }}
      release: ${{ steps.scope.outputs.release }}
      smoke_matrix: ${{ steps.scope.outputs.smoke_matrix }}
      gui_health: ${{ steps.scope.outputs.gui_health }}
      gui_portable: ${{ steps.scope.outputs.gui_portable }}
      relay: ${{ steps.scope.outputs.relay }}
      gui_build: ${{ steps.scope.outputs.gui_build }}
      mobile: ${{ steps.scope.outputs.mobile }}
      baseline_matrix: ${{ steps.tests.outputs.baseline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Validate workflow definitions before scheduling builds
        run: python3 scripts/check-workflows.py
      - id: scope
        run: python3 scripts/ci-scope.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
      - id: tests
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          args=()
          if [ -n "$PR_BASE" ]; then
            args+=("--base=$(git merge-base "$PR_BASE" HEAD)")
          fi
          node --input-type=module - <<'NODE' >> "$GITHUB_OUTPUT"
          import { readTestManifest } from './clients/gui/scripts/test-manifest.mjs';
          const entries = (await readTestManifest()).filter(entry => entry.layer === 'e2e' && entry.platforms.includes('darwin') && !entry.requires.includes('desktop-input'));
          console.log('baseline=' + JSON.stringify({ include: entries.map(entry => ({ script: entry.script, scenario: entry.script.replaceAll(':', '-') })) }));
          NODE

  gui-health:
    name: Linux GUI static health
    needs: scope
    if: needs.scope.outputs.gui_health == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
      - name: Select design audit baseline
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          COMPARISON_BASE: ${{ inputs.comparison_base }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            design_base="$(git merge-base "$PR_BASE" HEAD)"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$PUSH_BASE" ] && [[ ! "$PUSH_BASE" =~ ^0+$ ]]; then
            design_base="$PUSH_BASE"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$COMPARISON_BASE" ]; then
            design_base="$(git rev-parse --verify --end-of-options "$COMPARISON_BASE^{commit}")"
          else
            design_base="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "$design_base^{commit}"
          git merge-base --is-ancestor "$design_base" HEAD
          echo "AREAL_DESIGN_BASE=$design_base" >> "$GITHUB_ENV"
      - name: Check dependency-free health contracts and reviewed baseline
        run: python3 scripts/ci-preflight.py --groups gui-health --output target/ci/checks/gui-health
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: linux-gui-health
          path: target/ci/gui/health.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ci-checks-${{ github.run_id }}-${{ github.run_attempt }}-gui-health
          path: target/ci/checks/gui-health/
          if-no-files-found: warn
          retention-days: 7


  mobile:
    name: Linux mobile browser contracts
    needs: scope
    if: needs.scope.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.2.0'
      - name: Retain Relay runtime
        run: |
          echo "AREAL_RELAY_NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "AREAL_RELAY_NODE_BIN=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
      - name: Install locked dependencies and browsers
        run: |
          npm install --global pnpm@11.7.0
          pnpm --dir clients/gui install --frozen-lockfile
          pnpm --dir clients/gui/app exec playwright-core install --with-deps chromium webkit
      - name: Verify the shared mobile plan
        run: python3 scripts/ci-preflight.py --groups mobile --output target/ci/checks/mobile
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: mobile-browser-evidence
          path: .scratch/ios-development/browser/
          include-hidden-files: true
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ci-checks-${{ github.run_id }}-${{ github.run_attempt }}-mobile
          path: target/ci/checks/mobile/
          if-no-files-found: error
          retention-days: 7

  gui-portable:
    name: Linux GUI portable contracts
    needs: scope
    if: needs.scope.outputs.gui_portable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Start measured portable interval
        run: echo "GUI_PORTABLE_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
      - name: Install locked GUI dependencies
        run: |
          npm install --global pnpm@11.7.0
          pnpm --dir clients/gui install --frozen-lockfile
      - name: Select design audit baseline
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          COMPARISON_BASE: ${{ inputs.comparison_base }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            design_base="$(git merge-base "$PR_BASE" HEAD)"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$PUSH_BASE" ] && [[ ! "$PUSH_BASE" =~ ^0+$ ]]; then
            design_base="$PUSH_BASE"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$COMPARISON_BASE" ]; then
            design_base="$(git rev-parse --verify --end-of-options "$COMPARISON_BASE^{commit}")"
          else
            design_base="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "$design_base^{commit}"
          git merge-base --is-ancestor "$design_base" HEAD
          echo "AREAL_DESIGN_BASE=$design_base" >> "$GITHUB_ENV"
      - name: Execute the required portable plan and collect independent failures
        run: python3 scripts/ci-preflight.py --groups gui-portable --output target/ci/checks/gui-portable
      - name: Record portable interval
        if: always()
        run: |
          mkdir -p target/ci/gui
          node --input-type=module - <<'NODE'
          import { writeFileSync } from 'node:fs';
          const elapsedMs = Date.now() - Number(process.env.GUI_PORTABLE_STARTED) * 1000;
          writeFileSync('target/ci/gui/portable-interval.json', JSON.stringify({ elapsedMs, withinTenMinutes: elapsedMs < 600000, scope: 'first run step through final report; excludes runner provisioning and artifact upload', runId: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT, sha: process.env.GITHUB_SHA }, null, 2) + '\n');
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: linux-gui-portable
          path: |
            target/ci/gui/portable-*.json
            target/ci/gui/portable/**/report.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ci-checks-${{ github.run_id }}-${{ github.run_attempt }}-gui-portable
          path: target/ci/checks/gui-portable/
          if-no-files-found: warn
          retention-days: 7


  relay-contracts:
    name: Linux Relay transport contracts
    needs: scope
    if: needs.scope.outputs.relay == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
      - name: Prepare locked GUI inputs with the supported build runtime
        run: |
          npm install --global pnpm@11.7.0
          pnpm --dir clients/gui install --frozen-lockfile
          python3 scripts/ci-preflight.py --groups relay-build --output target/ci/checks/relay-build
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: ${{ !cancelled() }}
        with:
          node-version: '24.2.0'
      - name: Verify Relay contracts with their required runtime
        if: ${{ !cancelled() }}
        run: |
          mkdir -p target/ci/gui
          node --version > target/ci/gui/relay-node-version.txt
          python3 scripts/ci-preflight.py --groups relay --dependencies target/ci/checks/relay-build/report.json --output target/ci/checks/relay 2>&1 | tee target/ci/gui/relay-contracts.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: linux-relay-contracts
          path: |
            target/ci/gui/relay-contracts.log
            target/ci/gui/relay-node-version.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ci-checks-${{ github.run_id }}-${{ github.run_attempt }}-relay
          path: target/ci/checks/relay*/
          if-no-files-found: warn
          retention-days: 7


  gui:
    needs: [scope]
    if: needs.scope.outputs.gui_build == 'true'
    name: macOS GUI build and contracts
    outputs:
      artifact_ready: ${{ steps.smoke-inputs.outputs.artifact-id != '' }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Prepare isolated build temporary root
        run: |
          mkdir -p "$RUNNER_TEMP/gui-build"
          echo "TMPDIR=$RUNNER_TEMP/gui-build" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Locate GUI dependency cache
        id: tools
        run: |
          npm install --global pnpm@11.7.0
          echo "store=$(pnpm --dir clients/gui store path --silent)" >> "$GITHUB_OUTPUT"
          echo "node=$(node --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ steps.tools.outputs.store }}
            ~/Library/Caches/electron
            ~/Library/Caches/ms-playwright
          key: gui-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('clients/gui/pnpm-lock.yaml') }}
      - name: Prepare locked GUI dependencies
        run: |
          mkdir -p target/ci/gui "$TMPDIR"
          rustup show
          if ! command -v cmake; then brew install cmake; fi
          make gui-install
      - name: Restore Vite+ task cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: clients/gui/node_modules/.vite/task-cache
          key: gui-tasks-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.node }}-${{ hashFiles('clients/gui/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            gui-tasks-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.node }}-${{ hashFiles('clients/gui/pnpm-lock.yaml') }}-
      - name: Build and validate independent GUI checks from the shared plan
        id: build
        run: |
          mkdir -p target/ci/gui
          python3 scripts/ci-preflight.py --groups gui-build --output target/ci/checks/gui-build 2>&1 | tee target/ci/gui/gui-build.log
      - name: Archive smoke inputs from this exact build
        if: ${{ !cancelled() && steps.build.outputs.artifact_ready == 'true' }}
        run: |
          git rev-parse HEAD > target/ci/gui/source.sha
          tar -czf target/ci/gui/gui-smoke-inputs.tar.gz \
            target/ci/gui/source.sha target/debug/areal target/debug/areal-runtime \
            target/debug/areal-runtime-fs target/debug/areal-runtime-reaper \
            target/debug/shells clients/gui/renderer/dist clients/gui/dist/design-system \
            target/ci/checks/gui-build/report.json clients/gui/native/computer-helper/build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: smoke-inputs
        if: ${{ !cancelled() && steps.build.outputs.artifact_ready == 'true' }}
        with:
          name: macos-gui-smoke-inputs-${{ github.run_attempt }}
          path: target/ci/gui/gui-smoke-inputs.tar.gz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: macos-gui-build-evidence
          path: |
            target/ci/gui/*.log
            target/ci/gui/fingerprint.json
            target/ci/gui/bundle-report.json
            clients/gui/renderer/dist/bundle-analysis.json
            ${{ runner.temp }}/gui-build/
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ci-checks-${{ github.run_id }}-${{ github.run_attempt }}-gui-build
          path: target/ci/checks/gui-build/
          if-no-files-found: warn
          retention-days: 7


  core-contracts:
    name: macOS Core contracts
    needs: [scope, gui]
    if: ${{ always() && !cancelled() && needs.scope.outputs.gui_build == 'true' && needs.gui.outputs.artifact_ready == 'true' }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Prepare isolated contract temporary root
        run: |
          mkdir -p "$RUNNER_TEMP/gui-core-contracts"
          echo "TMPDIR=$RUNNER_TEMP/gui-core-contracts" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
      - name: Locate GUI dependency cache
        id: tools
        run: |
          npm install --global pnpm@11.7.0
          echo "store=$(pnpm --dir clients/gui store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ steps.tools.outputs.store }}
            ~/Library/Caches/electron
            ~/Library/Caches/ms-playwright
          key: gui-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('clients/gui/pnpm-lock.yaml') }}
      - name: Prepare locked GUI dependencies
        run: |
          mkdir -p "$TMPDIR"
          pnpm --dir clients/gui install --frozen-lockfile
      - name: Build desktop package entry points
        run: pnpm --dir clients/gui build:desktop
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: macos-gui-smoke-inputs-${{ github.run_attempt }}
          path: target/ci/gui
      - name: Restore and verify matching build
        run: |
          tar -xzf target/ci/gui/gui-smoke-inputs.tar.gz
          test "$(cat target/ci/gui/source.sha)" = "$(git rev-parse HEAD)"
          test -x target/debug/areal
          test -x target/debug/areal-runtime
          test -x target/debug/areal-runtime-fs
          test -x target/debug/areal-runtime-reaper
      - name: Verify registered Core-dependent contracts
        env:
          AREAL_CORE_BIN: ${{ github.workspace }}/target/debug/areal
        run: python3 scripts/ci-preflight.py --groups core-contracts --dependencies target/ci/checks/gui-build/report.json --output target/ci/checks/core-contracts 2>&1 | tee target/ci/gui/core-contracts.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: macos-core-contracts-evidence
          path: |
            target/ci/gui/core-contracts.log
            target/ci/gui/core-contracts/**/report.json
            ${{ runner.temp }}/gui-core-contracts/
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ci-checks-${{ github.run_id }}-${{ github.run_attempt }}-core-contracts
          path: target/ci/checks/core-contracts/
          if-no-files-found: warn
          retention-days: 7


  smoke:
    name: macOS GUI smoke (${{ matrix.scenario }})
    needs: [scope, gui]
    if: ${{ always() && !cancelled() && needs.scope.outputs.gui_build == 'true' && needs.gui.outputs.artifact_ready == 'true' }}
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.scope.outputs.smoke_matrix) }}
    steps:
      - name: Prepare isolated smoke temporary root
        run: |
          mkdir -p "$RUNNER_TEMP/gui-smoke"
          echo "TMPDIR=$RUNNER_TEMP/gui-smoke" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
      - name: Locate GUI dependency cache
        id: tools
        run: |
          npm install --global pnpm@11.7.0
          echo "store=$(pnpm --dir clients/gui store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ steps.tools.outputs.store }}
            ~/Library/Caches/electron
            ~/Library/Caches/ms-playwright
          key: gui-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('clients/gui/pnpm-lock.yaml') }}
      - name: Prepare locked GUI dependencies
        run: |
          mkdir -p "$TMPDIR"
          make gui-install
      - name: Build desktop package entry points
        run: pnpm --dir clients/gui build:desktop
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: macos-gui-smoke-inputs-${{ github.run_attempt }}
          path: target/ci/gui
      - name: Restore and verify smoke build
        run: |
          tar -xzf target/ci/gui/gui-smoke-inputs.tar.gz
          test "$(cat target/ci/gui/source.sha)" = "$(git rev-parse HEAD)"
          test -x target/debug/areal
          test -x target/debug/areal-runtime
          test -x target/debug/areal-runtime-fs
          test -x target/debug/areal-runtime-reaper
      - name: Run ${{ matrix.scenario }} smoke
        timeout-minutes: 10
        env:
          SMOKE_SCRIPT: ${{ matrix.script }}
          AREAL_CORE_BIN: ${{ github.workspace }}/target/debug/areal
        run: python3 scripts/ci-preflight.py --groups smoke --item "smoke:$SMOKE_SCRIPT" --dependencies target/ci/checks/gui-build/report.json --output "target/ci/checks/smoke-${{ matrix.scenario }}" 2>&1 | tee target/ci/gui/smoke.log
      - name: Collect isolated evidence
        if: always()
        run: |
          python3 - <<'PYTHON'
          import glob
          import os
          import tarfile
          roots = ["target/ci/gui/smoke.log", ".scratch/gui-evidence", ".scratch/side-chat-parity", os.environ["TMPDIR"]]
          with tarfile.open("gui-smoke-evidence.tar.gz", "w:gz") as archive:
              for path in roots:
                  if glob.glob(path):
                      archive.add(path, filter=lambda entry: entry if entry.isfile() or entry.isdir() or entry.issym() else None)
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: macos-gui-${{ matrix.scenario }}-evidence
          path: gui-smoke-evidence.tar.gz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ci-checks-${{ github.run_id }}-${{ github.run_attempt }}-smoke-${{ matrix.scenario }}
          path: target/ci/checks/smoke-${{ matrix.scenario }}/
          if-no-files-found: warn
          retention-days: 7


  linux-feasibility:
    name: Linux Electron repeated qualification
    needs: scope
    if: github.event_name == 'workflow_dispatch' && inputs.qualification == 'linux-feasibility'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Prepare native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 cmake
          npm install --global pnpm@11.7.0
          make gui-install
      - name: Build and freeze qualification inputs
        run: |
          make build
          make gui-build
          mkdir -p .local/dev-bin/gui-qualification
          cp -R target/debug/areal target/debug/areal-runtime target/debug/areal-runtime-fs target/debug/areal-runtime-reaper target/debug/shells .local/dev-bin/gui-qualification/
      - name: Qualify five sandboxed journeys with ten first attempts each
        env:
          AREAL_CORE_BIN: ${{ github.workspace }}/.local/dev-bin/gui-qualification/areal
        run: xvfb-run -a node clients/gui/scripts/repeat-tests.mjs --profile=linux-feasibility --output=target/ci/gui/linux-feasibility
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: linux-gui-feasibility
          path: |
            target/ci/gui/linux-feasibility/
            .scratch/startup-connection-investigation/
          if-no-files-found: warn
          retention-days: 7

  macos-baseline:
    name: macOS repeated baseline (${{ matrix.scenario }})
    needs: [scope, gui]
    if: github.event_name == 'workflow_dispatch' && inputs.qualification == 'macos-baseline'
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.scope.outputs.baseline_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
      - name: Prepare locked GUI dependencies
        run: |
          npm install --global pnpm@11.7.0
          make gui-install
          pnpm --dir clients/gui build:desktop
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: macos-gui-smoke-inputs-${{ github.run_attempt }}
          path: target/ci/gui
      - name: Restore and freeze matching Core inputs
        run: |
          tar -xzf target/ci/gui/gui-smoke-inputs.tar.gz
          test "$(cat target/ci/gui/source.sha)" = "$(git rev-parse HEAD)"
          mkdir -p .local/dev-bin/gui-qualification
          cp -R target/debug/areal target/debug/areal-runtime target/debug/areal-runtime-fs target/debug/shells .local/dev-bin/gui-qualification/
      - name: Record five first attempts
        env:
          AREAL_CORE_BIN: ${{ github.workspace }}/.local/dev-bin/gui-qualification/areal
          SMOKE_SCRIPT: ${{ matrix.script }}
        run: node clients/gui/scripts/repeat-tests.mjs --profile=macos-baseline "--scripts=$SMOKE_SCRIPT" --output=target/ci/gui/macos-baseline
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: macos-gui-baseline-${{ matrix.scenario }}
          path: |
            target/ci/gui/macos-baseline/
            .scratch/gui-evidence/
            .scratch/side-chat-parity/
            .scratch/startup-connection-investigation/
          if-no-files-found: warn
          retention-days: 7

  gate:
    name: GUI gate
    needs: [scope, gui-health, gui-portable, relay-contracts, gui, core-contracts, smoke, mobile]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ci-checks-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: target/ci/checks
      - name: Require every applicable current-attempt check and runner test
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci-gate.py --workflow gui
