name: GUI checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'
  NO_PROXY: 127.0.0.1,localhost

concurrency:
  group: gui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Determine applicable work
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      gui: ${{ steps.scope.outputs.gui }}
      release: ${{ steps.scope.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        run: python3 scripts/ci-scope.py

  gui:
    needs: scope
    if: needs.scope.outputs.gui == 'true'
    name: macOS GUI build and contracts
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select design audit baseline
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            design_base="$(git merge-base "$PR_BASE" HEAD)"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$PUSH_BASE" ] && [[ ! "$PUSH_BASE" =~ ^0+$ ]]; then
            design_base="$PUSH_BASE"
          else
            design_base="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "$design_base^{commit}"
          echo "AREAL_DESIGN_BASE=$design_base" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Locate GUI dependency cache
        id: tools
        run: |
          npm install --global pnpm@11.7.0
          echo "store=$(pnpm --dir clients/gui store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ steps.tools.outputs.store }}
            ~/Library/Caches/electron
            ~/Library/Caches/ms-playwright
          key: gui-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('clients/gui/pnpm-lock.yaml') }}
      - name: Prepare locked GUI dependencies
        run: |
          mkdir -p target/ci/gui
          rustup show
          if ! command -v cmake; then brew install cmake; fi
          make gui-install
      - name: Build desktop package entry points
        run: pnpm --dir clients/gui build:desktop
      - name: Verify design contracts and incremental audit
        run: pnpm --dir clients/gui verify:design 2>&1 | tee target/ci/gui/design.log
      - name: Verify fast GUI regressions
        run: pnpm --dir clients/gui run test:regressions
      - name: Record tool and cache fingerprints
        run: python3 scripts/ci-fingerprint.py > target/ci/gui/fingerprint.json
      - name: Check GUI types and public boundaries
        run: |
          pnpm --dir clients/gui typecheck 2>&1 | tee target/ci/gui/typecheck.log
          pnpm --dir clients/gui run verify 2>&1 | tee target/ci/gui/public.log
      - name: Verify native Core process lifecycle
        run: pnpm --dir clients/gui run test:core-process 2>&1 | tee target/ci/gui/core-process.log
      - name: Verify macOS DMG staging
        run: pnpm --dir clients/gui run test:macos-dmg 2>&1 | tee target/ci/gui/macos-dmg.log
      - name: Check Browser contracts and evidence
        run: pnpm --dir clients/gui run test:browser-contracts 2>&1 | tee target/ci/gui/browser-contracts.log
      - name: Build Core and GUI
        id: build
        run: |
          make build 2>&1 | tee target/ci/gui/core-build.log
          make gui-build 2>&1 | tee target/ci/gui/gui-build.log
      - name: Check registered desktop RPC routes
        run: cargo test --locked -p areal-app-server --lib desktop_registered_methods_have_dispatch_routes 2>&1 | tee target/ci/gui/rpc-routes.log
      - name: Archive smoke inputs from this exact build
        run: |
          git rev-parse HEAD > target/ci/gui/source.sha
          tar -czf target/ci/gui/gui-smoke-inputs.tar.gz \
            target/ci/gui/source.sha target/debug/areal target/debug/areal-runtime \
            target/debug/areal-runtime-fs target/debug/shells clients/gui/renderer/dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-gui-smoke-inputs
          path: target/ci/gui/gui-smoke-inputs.tar.gz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: macos-gui-build-evidence
          path: |
            target/ci/gui/*.log
            target/ci/gui/fingerprint.json
            /private/tmp/areal-core-process-*/
            /private/tmp/areal-browser-*/
            /private/tmp/shared-browser-06-evidence-*/
          retention-days: 7

  smoke:
    name: macOS GUI smoke (${{ matrix.scenario }})
    needs: [scope, gui]
    if: needs.scope.outputs.gui == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - scenario: history
            script: test:history-compat
          - scenario: migration
            script: test:e2e
          - scenario: composer
            script: test:composer
          - scenario: model-selection
            script: test:model-selection
          - scenario: queue
            script: test:queue
          - scenario: conversation-derivation
            script: test:conversation-derivation
          - scenario: side-chat
            script: test:side-chat-parity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Locate GUI dependency cache
        id: tools
        run: |
          npm install --global pnpm@11.7.0
          echo "store=$(pnpm --dir clients/gui store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ steps.tools.outputs.store }}
            ~/Library/Caches/electron
            ~/Library/Caches/ms-playwright
          key: gui-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('clients/gui/pnpm-lock.yaml') }}
      - name: Prepare locked GUI dependencies
        run: make gui-install
      - name: Build desktop package entry points
        run: pnpm --dir clients/gui build:desktop
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: macos-gui-smoke-inputs
          path: target/ci/gui
      - name: Restore and verify smoke build
        run: |
          tar -xzf target/ci/gui/gui-smoke-inputs.tar.gz
          test "$(cat target/ci/gui/source.sha)" = "$(git rev-parse HEAD)"
          test -x target/debug/areal
          test -x target/debug/areal-runtime
          test -x target/debug/areal-runtime-fs
      - name: Run ${{ matrix.scenario }} smoke
        timeout-minutes: 10
        env:
          SMOKE_SCRIPT: ${{ matrix.script }}
          AREAL_CORE_BIN: ${{ github.workspace }}/target/debug/areal
        run: pnpm --dir clients/gui run "$SMOKE_SCRIPT" 2>&1 | tee target/ci/gui/smoke.log
      - name: Collect isolated evidence
        if: always()
        run: |
          python3 - <<'PYTHON'
          import glob
          import tarfile
          roots = ["target/ci/gui/smoke.log", ".scratch/gui-evidence", ".scratch/side-chat-parity"]
          roots += [path for pattern in ("/private/tmp/areal-gui-*", "/private/tmp/ams-*", "/private/tmp/ahc-*", "/private/tmp/scp-*") for path in glob.glob(pattern)]
          with tarfile.open("gui-smoke-evidence.tar.gz", "w:gz") as archive:
              for path in roots:
                  if glob.glob(path):
                      archive.add(path, filter=lambda entry: entry if entry.isfile() or entry.isdir() or entry.issym() else None)
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: macos-gui-${{ matrix.scenario }}-evidence
          path: gui-smoke-evidence.tar.gz
          if-no-files-found: error
          retention-days: 7

  gate:
    name: GUI gate
    needs: [scope, gui, smoke]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require applicable work
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          WORK_RESULT: ${{ needs.gui.result }}
          SMOKE_RESULT: ${{ needs.scope.outputs.gui == 'false' && 'success' || needs.smoke.result }}
          NEEDED: ${{ needs.scope.outputs.gui }}
        run: python3 scripts/ci-gate.py
