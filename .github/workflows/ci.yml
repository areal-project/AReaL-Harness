name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# CI 不使用调试器或增量编译；减少链接、缓存传输和服务二进制指纹计算的开销。
env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

# PR 只保留最新一次；main/手动运行各自独立，避免替换 pending 提交。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Determine required verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      host_matrix: ${{ steps.plan.outputs.host_matrix }}
      container: ${{ steps.plan.outputs.container }}
      audit: ${{ steps.plan.outputs.audit }}
      input_hash: ${{ steps.plan.outputs.input_hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate shared plan and workflow declarations
        run: python3 scripts/check-workflows.py
      - id: plan
        run: python3 scripts/ci-scope.py
  host-protocol:
    name: Host protocol and desktop IPC freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Check generated contracts and rejection cases
        run: |
          npm ci --ignore-scripts
          npm install --global pnpm@11.7.0
          pnpm --dir clients/gui install --frozen-lockfile
          make host-protocol-check
      - name: Reject desktop command and operation growth
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="$PR_BASE"
          if [ -z "$base" ]; then base="$PUSH_BASE"; fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then base="$(git rev-parse HEAD^)"; fi
          node clients/gui/scripts/check-desktop-ipc-freeze.cjs --base "$base"

  host:
    name: ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.host_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            runtime/sdk-typescript/package-lock.json
            core/sdk-typescript/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - if: runner.os == 'Linux'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare toolchain
        run: |
          rustup show
          if [ "$RUNNER_OS" = macOS ] && ! command -v cmake; then brew install cmake; fi
          cmake --version
          if [ "$RUNNER_OS" = Linux ]; then python3 -m pip install uv==0.12.2; fi
      - if: matrix.rust_cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: host-debug-${{ runner.os }}
      - name: Identify private Bash cache
        if: runner.os == 'macOS' && matrix.rust_cache
        id: runtime-shell
        run: |
          key="$(python3 scripts/prepare-runtime-shell.py --cache-key)"
          test -n "$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Restore verified private Bash build
        if: runner.os == 'macOS' && matrix.rust_cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: target/runtime-shell/${{ steps.runtime-shell.outputs.key }}
          key: runtime-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-shell.outputs.key }}
      - name: Install locked dependencies
        run: |
          if [ "${{ matrix.rust_cache }}" = true ]; then
            make "${{ matrix.setup }}"
          else
            # 轻量文档门禁只需格式工具，既不下载 Cargo 依赖也不安装 SDK。
            npm ci --ignore-scripts
            uv sync --locked --only-group dev
          fi
          mkdir -p target/ci
      - name: Record tool and cache fingerprints
        run: python3 scripts/ci-fingerprint.py > target/ci/fingerprint.json
      - name: Verify host behavior
        env:
          NO_PROXY: 127.0.0.1,localhost
          CARGO_TEST_ARGS: --exclude areal-runtime-exec-native
          AREAL_UNIFIED_EVIDENCE_DIR: target/ci/unified
          AREAL_TEST_EVIDENCE: target/ci/local-service.json
        run: python3 scripts/ci-preflight.py --groups "${{ matrix.target }}" --output "target/ci/checks/host-${{ runner.os }}" 2>&1 | tee "target/ci/${{ matrix.log }}.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ${{ runner.os }}-host-logs
          path: target/ci/
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ci-checks-${{ github.run_id }}-${{ github.run_attempt }}-host-${{ runner.os }}
          path: target/ci/checks/host-${{ runner.os }}/
          if-no-files-found: warn
          retention-days: 7

  container:
    name: Linux container Runtime
    needs: plan
    if: needs.plan.outputs.container == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: mkdir -p target/ci
      - name: Verify container namespace prerequisites
        run: |
          # Ubuntu 的 userns 限制需要显式允许 Bubblewrap；不修改全局 sysctl。
          sudo apparmor_parser --replace <<'APPARMOR'
          abi <abi/4.0>,
          profile areal-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          APPARMOR
          docker run --rm \
            --security-opt seccomp=unconfined --security-opt systempaths=unconfined \
            --security-opt apparmor=unconfined \
            alpine:3.22.4 sh -ec '
              apk add --no-cache bubblewrap
              exec bwrap --unshare-all --die-with-parent --cap-drop ALL \
                --ro-bind / / --proc /proc --dev /dev -- /bin/true
            '
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the supported container profile
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tests/e2e/docker/Dockerfile
          build-args: |
            BUILD_PROFILE=ci
            INSTALL_CODEX=0
            INSTALL_CLAUDE_CODE=0
          load: true
          tags: areal-ci:runtime
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            io.areal.verification-input=${{ needs.plan.outputs.input_hash }}
          cache-from: |
            type=gha,scope=areal-runtime-tests
            type=gha,scope=areal-runtime
          cache-to: type=gha,scope=areal-runtime,mode=min
      - name: Build native backend tests
        if: ${{ !cancelled() }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tests/e2e/docker/Dockerfile
          target: runtime-tests
          build-args: BUILD_PROFILE=ci
          load: true
          tags: areal-ci:runtime-tests
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            io.areal.verification-input=${{ needs.plan.outputs.input_hash }}
          # 只恢复完整测试图；最终镜像的 min 图会干扰中间层候选的选择。
          cache-from: type=gha,scope=areal-runtime-tests
          cache-to: type=gha,scope=areal-runtime-tests,mode=max
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: ${{ !cancelled() }}
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Execute every supported container check and collect independent failures
        if: ${{ !cancelled() }}
        run: |
          mkdir -p target/ci
          python3 scripts/ci-preflight.py --groups container --output target/ci/checks/container 2>&1 | tee target/ci/container-checks.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: linux-container-logs
          path: target/ci/
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ci-checks-${{ github.run_id }}-${{ github.run_attempt }}-container
          path: target/ci/checks/container/
          if-no-files-found: warn
          retention-days: 7

  # 保留原检查名；矩阵和容器必须全部成功，不能把跳过或取消视为通过。
  linux:
    name: Linux checks and container Runtime
    needs: [plan, host, container, dependencies]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ci-checks-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: target/ci/checks
      - name: Require every planned host, native, container and audit check
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci-gate.py --workflow verify

  dependencies:
    name: Dependency advisories
    needs: plan
    if: needs.plan.outputs.audit == 'true'
    uses: ./.github/workflows/dependency-audit.yml
