name: Skill overhead official Linux bundle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    name: Frozen musl bundle
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b3e82304d690622b9d94ad24793ccbae92d1725c
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: skill-overhead-musl
          cache-on-failure: true
      - name: Build complete release in musl builder
        shell: bash
        env:
          EXPECTED_REVISION: b3e82304d690622b9d94ad24793ccbae92d1725c
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/musl-out"
          docker pull rust:1.94.0-alpine3.22
          docker image inspect rust:1.94.0-alpine3.22 > "$RUNNER_TEMP/musl-out/builder-image.json"
          docker run --rm --privileged --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/src" -v "$RUNNER_TEMP/musl-out:/out" \
            -e EXPECTED_REVISION -e CARGO_BUILD_JOBS=2 \
            rust:1.94.0-alpine3.22 sh -c '
              set -eu
              apk add --no-cache bash git python3 nodejs npm make cmake gcc g++ musl-dev linux-headers perl pkgconf binutils openssl-dev openssl-libs-static zlib-dev zlib-static bubblewrap
              git config --global --add safe.directory /src
              cd /src
              test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
              test -z "$(git status --porcelain --untracked-files=no)"
              npm ci --ignore-scripts
              make release
              python3 scripts/package.py --profile release --output /out/areal
              readelf -l /out/areal/bin/areal > /out/elf-program-headers.txt
              ! grep -q INTERP /out/elf-program-headers.txt
              tar -czf /out/areal-musl.tar.gz -C /out areal
              sha256sum /out/areal-musl.tar.gz > /out/areal-musl.tar.gz.sha256
              git status --porcelain --untracked-files=no > /out/source-status.txt
              test ! -s /out/source-status.txt
              python3 scripts/release-smoke.py --bundle /out/areal
            ' 2>&1 | tee "$RUNNER_TEMP/musl-out/build.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: skill-overhead-musl
          path: |
            ${{ runner.temp }}/musl-out/*.json
            ${{ runner.temp }}/musl-out/*.txt
            ${{ runner.temp }}/musl-out/*.log
            ${{ runner.temp }}/musl-out/*.tar.gz
            ${{ runner.temp }}/musl-out/*.sha256
          if-no-files-found: error
          retention-days: 14
