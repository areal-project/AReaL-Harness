name: Dependency audit
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  audit:
    name: All lockfile advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.7.0
      # 周一的独立审计不复用工具缓存，验证安装路径而不运行完整 GUI/macOS。
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        if: github.event_name != 'schedule'
        id: audit-cache
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2
      - name: Install cargo-audit
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit every lockfile even after Rust scanner installation failure
        if: ${{ !cancelled() }}
        run: |
          mkdir -p target/ci/audit
          python3 scripts/ci-fingerprint.py > target/ci/audit/fingerprint.json
          python3 scripts/dependency-audit.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: dependency-audit-evidence
          path: target/ci/audit/
          retention-days: 7
