name: Dependency audit
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  audit:
    name: All lockfile advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
      - run: npm install --global pnpm@11.7.0
      - name: Install verified prebuilt cargo-audit
        run: |
          directory="$RUNNER_TEMP/cargo-audit"
          mkdir -p "$directory"
          curl --fail --silent --show-error --location \
            https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz \
            --output "$directory/archive.tgz"
          echo "ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39  $directory/archive.tgz" | sha256sum --check
          tar -xzf "$directory/archive.tgz" -C "$directory" --strip-components=1
          echo "$directory" >> "$GITHUB_PATH"
          "$directory/cargo-audit" --version
      - name: Audit every lockfile even after Rust scanner installation failure
        if: ${{ !cancelled() }}
        run: |
          mkdir -p target/ci/audit
          python3 scripts/ci-fingerprint.py > target/ci/audit/fingerprint.json
          python3 scripts/ci-preflight.py --groups audit --output target/ci/checks/audit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: dependency-audit-evidence
          path: target/ci/audit/
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ci-checks-${{ github.run_id }}-${{ github.run_attempt }}-audit
          path: target/ci/checks/audit/
          if-no-files-found: warn
          retention-days: 7
