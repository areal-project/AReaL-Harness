<text x="306" y="316" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="normal" fill="#3A3D44">call /</text>
<text x="306" y="333" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="normal" fill="#3A3D44">receipt</text>
<polyline points="608,352 672,352" fill="none" stroke="#3A3D44" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="610" y="316" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="normal" fill="#3A3D44">private</text>
<text x="610" y="333" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="normal" fill="#3A3D44">channel</text>
<polyline points="912,352 976,352" fill="none" stroke="#3A3D44" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
