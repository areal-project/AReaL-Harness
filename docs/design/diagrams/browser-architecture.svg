<text x="384" y="342" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="normal" fill="#3A3D44">Bound ToolHost connection</text>
<text x="384" y="367" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="normal" fill="#3A3D44">Authentication + routing</text>
<text x="384" y="392" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="normal" fill="#3A3D44">Reply/cancel correlation</text>
<text x="384" y="417" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="normal" fill="#3A3D44">No agent loop</text>
