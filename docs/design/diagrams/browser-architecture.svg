<text x="64" y="92" font-family="Georgia, serif" font-size="34" font-weight="normal" fill="#0F1012">Shared Browser — ownership and execution</text>
<text x="64" y="132" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="normal" fill="#3A3D44">AReaL Harness design: extend the existing authenticated callback path and native preview.</text>
<text x="64" y="184" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" fill="#8B8F97">DESIGN PROPOSAL — NOT IMPLEMENTED</text>
