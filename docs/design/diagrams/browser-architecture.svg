<text x="688" y="392" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="normal" fill="#3A3D44">Input fence + narrow CDP</text>
<text x="688" y="417" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="normal" fill="#3A3D44">Native resource authority</text>
