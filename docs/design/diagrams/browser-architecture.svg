<text x="920" y="333" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="normal" fill="#3A3D44">CDP</text>
<polyline points="1216,352 1280,352" fill="none" stroke="#3A3D44" stroke-width="1.5" marker-end="url(#a)"/>
<text x="1220" y="316" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="normal" fill="#3A3D44">same</text>
<text x="1220" y="333" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="normal" fill="#3A3D44">window</text>
<polyline points="1400,488 1400,592 792,592 792,488" fill="none" stroke="#3A3D44" stroke-width="1.5" marker-end="url(#a)"/>
<text x="820" y="568" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="normal" fill="#3A3D44">Human control: priority local fence before Core coordination</text>
<line x1="64" y1="710" x2="1536" y2="710" stroke="#E9E9EA"/>
<text x="64" y="754" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="normal" fill="#3A3D44">Ownership stays explicit: Core owns the task record; Main owns physical pages; the Renderer owns only unsent drafts and UI state.</text>
<text x="64" y="788" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="normal" fill="#3A3D44">Runtime still owns development servers and code/file execution. A client browser is not automatically inside the Runtime sandbox.</text>
<text x="64" y="822" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="normal" fill="#3A3D44">No second browser daemon, no public application-wide CDP endpoint, and no duplicate Agent Loop.</text>
<text x="64" y="856" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="normal" fill="#3A3D44">R2 target: shared-page work, takeover, annotations, diagnostics and code verification. Persistent Browser Profiles are deferred.</text>
</svg>