<line x1="992" y1="314" x2="1200" y2="314" stroke="#E9E9EA"/>
<text x="992" y="342" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="normal" fill="#3A3D44">Existing WebContentsView</text>
<text x="992" y="367" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="normal" fill="#3A3D44">One DOM + site Session</text>
<text x="992" y="392" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="normal" fill="#3A3D44">No Node / product bridge</text>
<text x="992" y="417" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="normal" fill="#3A3D44">Same object as preview</text>
