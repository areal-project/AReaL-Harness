<line x1="1296" y1="314" x2="1504" y2="314" stroke="#E9E9EA"/>
<text x="1296" y="342" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="normal" fill="#3A3D44">Tabs + annotations</text>
<text x="1296" y="367" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="normal" fill="#3A3D44">Control + evidence</text>
<text x="1296" y="392" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="normal" fill="#3A3D44">Drafts + projections</text>
<text x="1296" y="417" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="normal" fill="#3A3D44">Visible human takeover</text>
