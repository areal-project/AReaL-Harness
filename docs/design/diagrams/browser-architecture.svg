<text x="80" y="392" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="normal" fill="#3A3D44">Client-backed receipts</text>
<text x="80" y="417" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="normal" fill="#3A3D44">No Electron dependency</text>
